<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="monthbook-standalone" content="1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="月結簿">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f3f5f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1413" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>月結簿</title>
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: phone-first single column ledger. Sticky month bar, one hero total,
   quick-add form, then day-grouped rows, category bars and six month columns. */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --ink:#14201d; --ink-2:#4c5b57; --muted:#64726e;
  --line:#dfe5e3; --track:#e3ebe9; --accent:#007f66; --accent-ink:#ffffff; --accent-soft:#dcefeb;
  --warn:#a15c00; --crit:#c23434; --crit-soft:#fbe9e9;
  --font-ui:-apple-system,BlinkMacSystemFont,"PingFang HK","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-num:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"PingFang HK","Noto Sans TC",system-ui,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1413; --surface:#181f1d; --ink:#eef3f1; --ink-2:#b4c0bc; --muted:#8b9894;
    --line:#2a3431; --track:#25302d; --accent:#2ea891; --accent-ink:#06231e; --accent-soft:#17332e;
    --warn:#e0a544; --crit:#ef6f6f; --crit-soft:#3a1d1d; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1413; --surface:#181f1d; --ink:#eef3f1; --ink-2:#b4c0bc; --muted:#8b9894;
  --line:#2a3431; --track:#25302d; --accent:#2ea891; --accent-ink:#06231e; --accent-soft:#17332e;
  --warn:#e0a544; --crit:#ef6f6f; --crit-soft:#3a1d1d; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in{max-width:560px;margin:0 auto;padding:6px 16px;display:flex;align-items:center;gap:4px}
.nav{width:44px;height:44px;border:0;background:none;border-radius:50%;font-size:22px;color:var(--ink-2)}
.nav:active{background:var(--track)}
.month{flex:1;text-align:center;font-weight:650;font-size:18px;letter-spacing:.02em}
.now{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;color:var(--ink-2)}

.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:16px 40px;display:flex;flex-direction:column;gap:24px}
h2{margin:0;font-size:14px;font-weight:600;color:var(--muted);letter-spacing:.06em}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.head small{font-size:13px;color:var(--muted)}
section{display:flex;flex-direction:column;gap:10px;min-width:0}

.demo{background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:14px}
.demo p{margin:0;flex:1 1 200px;min-width:0}

.hero-label{font-size:14px;color:var(--muted)}
.hero-val{font-family:var(--font-num);font-size:clamp(36px,11vw,52px);font-weight:700;line-height:1.1;letter-spacing:-.01em;overflow-wrap:anywhere}
.hero-val span{font-size:.4em;font-weight:600;color:var(--muted);margin-right:6px;letter-spacing:.04em}
.delta{font-size:14px;color:var(--ink-2)}
.stats{display:flex;flex-wrap:wrap;gap:8px 28px;margin:6px 0 0;padding:0}
.stats div{display:flex;flex-direction:column}
.stats dt{font-size:12px;color:var(--muted)}
.stats dd{margin:0;font-family:var(--font-num);font-variant-numeric:tabular-nums;font-weight:600}
.meter{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.meter-track{height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.meter-fill{height:100%;background:var(--accent);border-radius:0 4px 4px 0}
.meter.warn .meter-fill{background:var(--warn)}
.meter.over .meter-fill{background:var(--crit)}
.meter-text{font-size:13px;color:var(--ink-2);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.meter.over .meter-text b{color:var(--crit)}

.form{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.frow{display:flex;gap:10px;flex-wrap:wrap}
.frow>*{min-width:0}
.field{display:flex;flex-direction:column;gap:4px;flex:1 1 140px}
.field label,.legend{font-size:12px;color:var(--muted)}
.inp{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;min-height:44px}
.inp.amt{font-family:var(--font-num);font-size:22px;font-weight:650}
.err{font-size:13px;color:var(--crit)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg);align-self:flex-start}
.seg label{padding:9px 16px;font-size:15px;color:var(--ink-2);min-height:42px;display:flex;align-items:center}
.seg input:checked+label{background:var(--accent);color:var(--accent-ink);font-weight:600}
.seg input:focus-visible+label{outline:2px solid var(--accent);outline-offset:-4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:14px;color:var(--ink-2);background:var(--bg)}
.chips input:checked+label{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:600}
.chips input:focus-visible+label{outline:2px solid var(--accent);outline-offset:2px}
.check{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2)}
.check input,.row input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin:0}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;min-height:44px;font-size:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:650;flex:1 1 140px}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn:active{opacity:.75}

.carry{border:1px dashed var(--accent);background:none;border-radius:var(--r);padding:12px 14px;text-align:left;font-size:14px;color:var(--ink)}
.carry b{color:var(--accent)}
.filter{border:1px solid var(--accent);background:var(--accent-soft);border-radius:999px;padding:5px 12px;font-size:13px}
.day{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted);padding:10px 2px 4px}
.rows{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding-left:14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;justify-content:space-between;border:0;background:none;padding:11px 14px 11px 0;text-align:left;min-height:52px}
.row-text{min-width:0;display:flex;flex-direction:column}
.row-desc{overflow-wrap:anywhere}
.row-meta{font-size:12px;color:var(--muted)}
.row-amt{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.row-amt.in{color:var(--accent)}
.row.off .row-desc,.row.off .row-amt{text-decoration:line-through;color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:18px 2px}

.cats{display:flex;flex-direction:column;gap:2px}
.cat{border:0;background:none;padding:8px 2px;text-align:left;display:flex;flex-direction:column;gap:6px;border-radius:8px}
.cat[aria-pressed="true"]{background:var(--accent-soft);padding-inline:8px}
.cat-top{display:flex;justify-content:space-between;gap:12px;font-size:15px}
.cat-top small{color:var(--muted);font-size:12px;margin-left:6px}
.cat-track{height:10px}
.cat-fill{height:100%;min-width:3px;background:var(--accent);border-radius:0 4px 4px 0}

.trend{display:flex;align-items:flex-end;gap:6px;border-bottom:1px solid var(--line)}
.col{flex:1;min-width:0;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.col-val{font-size:12px;color:var(--muted);font-family:var(--font-num);font-variant-numeric:tabular-nums}
.col-bar{width:24px;max-width:70%;background:var(--accent);opacity:.45;border-radius:4px 4px 0 0;min-height:2px}
.col[aria-current="true"] .col-bar{opacity:1}
.col[aria-current="true"] .col-val{color:var(--ink);font-weight:650}
.trend-x{display:flex;gap:6px;font-size:12px;color:var(--muted);text-align:center}
.trend-x span{flex:1}
.trend-x .cur{color:var(--ink);font-weight:650}

details{border-top:1px solid var(--line);padding-top:14px}
summary{font-size:15px;color:var(--ink-2);cursor:pointer;min-height:32px}
.set{display:flex;flex-direction:column;gap:14px;padding-top:12px}
.note{font-size:13px;color:var(--muted);margin:0}
textarea.inp{min-height:96px;font-size:13px;font-family:ui-monospace,Menlo,monospace}

.toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:528px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:var(--r);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;z-index:9}
.toast button{border:0;background:none;color:inherit;font-weight:700;text-decoration:underline;padding:6px}
</style>
</head>
<body>

<header class="bar">
  <div class="bar-in">
    <button class="nav" id="prev" aria-label="上個月">‹</button>
    <div class="month" id="monthLabel" aria-live="polite"></div>
    <button class="now" id="toNow" hidden>返今月</button>
    <button class="nav" id="next" aria-label="下個月">›</button>
  </div>
</header>

<main class="wrap">
  <div class="demo" id="demoBanner" hidden>
    <p><b>示範資料。</b>以下數字係例子，改動唔會儲存。</p>
    <button class="btn primary" id="startReal" style="flex:0 1 auto">清走示範，開始記帳</button>
  </div>

  <section aria-label="本月總結">
    <div>
      <div class="hero-label" id="heroLabel"></div>
      <div class="hero-val" id="heroVal"></div>
      <div class="delta" id="delta"></div>
    </div>
    <div class="meter" id="meter" hidden>
      <div class="meter-track"><div class="meter-fill" id="meterFill"></div></div>
      <div class="meter-text" id="meterText"></div>
    </div>
    <dl class="stats" id="stats"></dl>
  </section>

  <form class="form" id="form" novalidate>
    <div class="head"><h2 id="formTitle">新增一筆</h2></div>
    <div class="frow">
      <div class="field" style="flex:1 1 130px">
        <label for="amt">金額</label>
        <input class="inp amt" id="amt" inputmode="decimal" autocomplete="off" placeholder="0.00">
      </div>
      <div class="field" style="flex:2 1 170px">
        <label for="desc">說明</label>
        <input class="inp" id="desc" autocomplete="off" maxlength="60" placeholder="例如：超市">
      </div>
    </div>
    <div class="err" id="amtErr" hidden>請輸入大過 0 嘅金額。</div>
    <div class="frow" style="align-items:flex-end">
      <div>
        <div class="legend">類型</div>
        <div class="seg" role="radiogroup" aria-label="類型">
          <input class="sr" type="radio" name="type" id="tOut" value="out" checked><label for="tOut">支出</label>
          <input class="sr" type="radio" name="type" id="tIn" value="in"><label for="tIn">收入</label>
        </div>
      </div>
      <div class="field">
        <label for="date">日期</label>
        <input class="inp" id="date" type="date">
      </div>
    </div>
    <div id="catBox">
      <div class="legend" style="margin-bottom:6px">分類</div>
      <div class="chips" id="catChips" role="radiogroup" aria-label="分類"></div>
    </div>
    <label class="check" for="fixed"><input type="checkbox" id="fixed">每月固定（下個月可以一鍵帶入）</label>
    <div class="actions">
      <button class="btn primary" type="submit" id="submitBtn">加入</button>
      <button class="btn" type="button" id="cancelEdit" hidden>取消</button>
      <button class="btn danger" type="button" id="delBtn" hidden>刪除</button>
    </div>
  </form>

  <section aria-labelledby="listH">
    <div class="head">
      <h2 id="listH">明細</h2>
      <small id="listNote"></small>
    </div>
    <button class="filter" id="clearFilter" hidden></button>
    <button class="carry" id="carry" hidden></button>
    <div id="list"></div>
  </section>

  <section aria-labelledby="catH">
    <div class="head"><h2 id="catH">分類</h2><small>撳一下可以篩選明細</small></div>
    <div class="cats" id="cats"></div>
  </section>

  <section aria-labelledby="trendH">
    <div class="head"><h2 id="trendH">近 6 個月支出</h2><small>撳一下跳去嗰個月</small></div>
    <div class="trend" id="trend"></div>
    <div class="trend-x" id="trendX"></div>
  </section>

  <details>
    <summary>設定同備份</summary>
    <div class="set">
      <div class="frow">
        <div class="field">
          <label for="budget">每月預算（留空即係唔設）</label>
          <input class="inp num" id="budget" inputmode="decimal" autocomplete="off" placeholder="例如 15000">
        </div>
        <div class="field" style="flex:0 1 120px">
          <label for="cur">貨幣</label>
          <select class="inp" id="cur"><option>MOP</option><option>HKD</option><option>CNY</option><option>USD</option></select>
        </div>
      </div>
      <div class="actions">
        <button class="btn" type="button" id="copyJson">複製備份</button>
        <button class="btn" type="button" id="copyCsv">複製 CSV（全部）</button>
      </div>
      <div class="field">
        <label for="io">還原：將之前複製嘅備份貼喺度</label>
        <textarea class="inp" id="io" spellcheck="false"></textarea>
      </div>
      <div class="actions">
        <button class="btn" type="button" id="importBtn">匯入備份</button>
        <button class="btn danger" type="button" id="wipe">清除全部資料</button>
      </div>
      <p class="note">資料只存喺呢部機嘅瀏覽器入面，唔會上傳去任何地方。換機或者清除瀏覽器資料之前，記得先複製備份，貼去備忘錄保存。</p>
    </div>
  </details>
</main>

<div class="toast" id="toast" role="status" hidden><span id="toastMsg"></span><button id="toastAct" hidden></button></div>

<script>
(function(){
'use strict';
document.documentElement.lang='zh-Hant';
var KEY='monthbook.v1';
var CATS=['飲食','交通','住屋','水電網絡','日用','娛樂','醫療','其他'];
var WD=['日','一','二','三','四','五','六'];
var $=function(id){return document.getElementById(id)};
var pad=function(n){return String(n).padStart(2,'0')};
function today(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function shiftYm(ym,n){var p=ym.split('-').map(Number);var d=new Date(p[0],p[1]-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)}
function daysIn(ym){var p=ym.split('-').map(Number);return new Date(p[0],p[1],0).getDate()}
function fmt(c){return (c/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function compact(c){var v=c/100;if(v>=100000)return Math.round(v/1000)+'k';if(v>=10000)return (v/1000).toFixed(1)+'k';return Math.round(v).toLocaleString('en-US')}
function parseAmt(s){var n=parseFloat(String(s).replace(/[,\s]/g,''));return isFinite(n)&&n>0?Math.round(n*100):null}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

function demoState(){
  var now=today(),cur=now.slice(0,7),day=Number(now.slice(8)),out=[];
  var tpl=[[1,650000,'租金','住屋',1],[1,28800,'寬頻','水電網絡',1],[1,15800,'手機月費','水電網絡',1],[2,4200,'午餐','飲食',0],[2,31250,'超市','日用',0],
    [3,640,'巴士','交通',0],[5,18600,'晚飯','飲食',0],[8,42300,'電費','水電網絡',0],[9,9500,'的士','交通',0],[12,16000,'戲飛','娛樂',0],
    [15,27480,'超市','日用',0],[18,5600,'午餐','飲食',0],[21,12000,'水費','水電網絡',0],[24,36000,'朋友生日飯','飲食',0],[27,8800,'洗衣','其他',0]];
  for(var k=5;k>=0;k--){
    var ym=shiftYm(cur,-k),wob=[0,1400,-900,2300,-1700,600][k];
    tpl.forEach(function(t,i){
      if(k===0&&t[0]>day)return;
      out.push({id:'d'+k+'_'+i,date:ym+'-'+pad(t[0]),amt:t[4]?t[1]:Math.max(500,t[1]+wob*(i%4)),type:'out',desc:t[2],cat:t[3],on:true,fixed:!!t[4]});
    });
  }
  return {entries:out,budget:1200000,cur:'MOP',demo:true};
}
function load(){
  try{var raw=localStorage.getItem(KEY);if(raw){var s=JSON.parse(raw);if(s&&Array.isArray(s.entries)){s.demo=false;s.cur=s.cur||'MOP';return s}}}catch(e){}
  return demoState();
}
function save(){
  if(S.demo)return;
  try{localStorage.setItem(KEY,JSON.stringify({entries:S.entries,budget:S.budget,cur:S.cur}))}
  catch(e){toast('儲存唔到：瀏覽器封鎖咗儲存空間。請先複製備份。')}
}

var S=load(),ym=today().slice(0,7),filterCat=null,editId=null,lastDel=null,toastTimer=null;

function inMonth(m){return S.entries.filter(function(e){return e.date.slice(0,7)===m})}
function sum(list,type){return list.reduce(function(a,e){return a+(e.on&&e.type===type?e.amt:0)},0)}
function monthName(m){var p=m.split('-');return p[0]+'年'+Number(p[1])+'月'}
function carryList(){
  var cur=inMonth(ym),prev=inMonth(shiftYm(ym,-1)).filter(function(e){return e.fixed});
  return prev.filter(function(p){return !cur.some(function(c){return c.desc===p.desc&&c.cat===p.cat&&c.type===p.type})});
}

function render(){
  var nowYm=today().slice(0,7),list=inMonth(ym),out=sum(list,'out'),inc=sum(list,'in');
  $('monthLabel').textContent=monthName(ym);
  $('toNow').hidden=ym===nowYm;
  $('demoBanner').hidden=!S.demo;

  $('heroLabel').textContent=Number(ym.slice(5))+'月支出';
  $('heroVal').innerHTML='<span>'+esc(S.cur)+'</span>'+fmt(out);
  var prevOut=sum(inMonth(shiftYm(ym,-1)),'out');
  if(prevOut>0){var d=out-prevOut,pc=Math.round(Math.abs(d)/prevOut*100);
    $('delta').textContent=d===0?'同上個月一樣':'比上個月'+(d>0?'多 ':'少 ')+S.cur+' '+fmt(Math.abs(d))+'（'+pc+'%）'}
  else $('delta').textContent='上個月未有記錄';

  var days=ym===nowYm?Number(today().slice(8)):daysIn(ym);
  var st=[['日均',S.cur+' '+fmt(Math.round(out/days))],['筆數',String(list.filter(function(e){return e.on}).length)]];
  if(inc>0){st.push(['收入',S.cur+' '+fmt(inc)]);st.push(['結餘',(inc-out<0?'−':'')+S.cur+' '+fmt(Math.abs(inc-out))])}
  $('stats').innerHTML=st.map(function(p){return '<div><dt>'+p[0]+'</dt><dd>'+esc(p[1])+'</dd></div>'}).join('');

  var m=$('meter');
  if(S.budget>0){
    var r=out/S.budget;m.hidden=false;m.className='meter'+(r>1?' over':r>=.85?' warn':'');
    $('meterFill').style.width=Math.min(100,r*100)+'%';
    $('meterText').innerHTML='<span>預算 '+esc(S.cur)+' '+fmt(S.budget)+' · 已用 '+Math.round(r*100)+'%</span><b>'+(r>1?'超支 ':'尚餘 ')+esc(S.cur)+' '+fmt(Math.abs(S.budget-out))+'</b>';
  }else m.hidden=true;

  renderList(list);renderCats(list,out);renderTrend();
}

function renderList(list){
  var off=list.filter(function(e){return !e.on});
  $('listNote').textContent=off.length?'剔走咗 '+off.length+' 項，唔計入總數':list.length?'取消剔號可以暫時唔計':'';
  var cf=$('clearFilter');cf.hidden=!filterCat;
  var shown=filterCat?list.filter(function(e){return e.cat===filterCat}):list;
  if(filterCat)cf.textContent='只睇「'+filterCat+'」· '+S.cur+' '+fmt(sum(shown,'out'))+'　✕';
  var cl=carryList(),cb=$('carry');cb.hidden=!cl.length;
  if(cl.length)cb.innerHTML='<b>帶入上個月 '+cl.length+' 項固定開支</b>（'+esc(S.cur)+' '+fmt(cl.reduce(function(a,e){return a+e.amt},0))+'）：'+esc(cl.map(function(e){return e.desc||e.cat}).join('、'));
  if(!shown.length){$('list').innerHTML='<div class="empty">'+(filterCat?'呢個分類今個月未有記錄。':'今個月未有記錄。喺上面輸入金額就可以加第一筆。')+'</div>';return}
  var by={};shown.forEach(function(e){(by[e.date]=by[e.date]||[]).push(e)});
  $('list').innerHTML=Object.keys(by).sort().reverse().map(function(d){
    var dt=new Date(Number(d.slice(0,4)),Number(d.slice(5,7))-1,Number(d.slice(8)));
    var rows=by[d].slice().reverse().map(function(e){
      var name=e.desc||e.cat;
      return '<li class="row'+(e.on?'':' off')+'"><input type="checkbox" id="on-'+esc(e.id)+'" data-toggle="'+esc(e.id)+'"'+(e.on?' checked':'')+' aria-label="計入總數：'+esc(name)+'">'+
        '<button type="button" class="row-main" data-edit="'+esc(e.id)+'"><span class="row-text"><span class="row-desc">'+esc(name)+'</span><span class="row-meta">'+esc(e.cat)+(e.fixed?' · 固定':'')+'</span></span>'+
        '<span class="row-amt'+(e.type==='in'?' in':'')+'">'+(e.type==='in'?'+':'')+fmt(e.amt)+'</span></button></li>';
    }).join('');
    return '<div class="day"><span>'+Number(d.slice(5,7))+'月'+Number(d.slice(8))+'日 週'+WD[dt.getDay()]+'</span><span class="num">'+fmt(sum(by[d],'out'))+'</span></div><ul class="rows">'+rows+'</ul>';
  }).join('');
}

function renderCats(list,out){
  var t={};list.forEach(function(e){if(e.on&&e.type==='out')t[e.cat]=(t[e.cat]||0)+e.amt});
  var keys=Object.keys(t).sort(function(a,b){return t[b]-t[a]});
  if(!keys.length){$('cats').innerHTML='<div class="empty">未有支出。</div>';return}
  var max=t[keys[0]];
  $('cats').innerHTML=keys.map(function(k){
    return '<button type="button" class="cat" data-cat="'+esc(k)+'" aria-pressed="'+(filterCat===k)+'"><span class="cat-top"><span>'+esc(k)+'<small>'+Math.round(t[k]/out*100)+'%</small></span><span class="num">'+fmt(t[k])+'</span></span>'+
      '<span class="cat-track"><span class="cat-fill" style="display:block;width:'+(t[k]/max*100)+'%"></span></span></button>';
  }).join('');
}

function renderTrend(){
  var ms=[];for(var k=5;k>=0;k--)ms.push(shiftYm(ym,-k));
  var vals=ms.map(function(m){return sum(inMonth(m),'out')}),max=Math.max.apply(null,vals);
  $('trend').innerHTML=ms.map(function(m,i){
    var h=max?Math.round(vals[i]/max*96):0;
    return '<button type="button" class="col" data-ym="'+m+'" aria-current="'+(m===ym)+'" aria-label="'+monthName(m)+'支出 '+fmt(vals[i])+'"><span class="col-val">'+(vals[i]?compact(vals[i]):'–')+'</span><span class="col-bar" style="height:'+h+'px"></span></button>';
  }).join('');
  $('trendX').innerHTML=ms.map(function(m){return '<span'+(m===ym?' class="cur"':'')+'>'+Number(m.slice(5))+'月</span>'}).join('');
}

function renderChips(sel){
  $('catChips').innerHTML=CATS.map(function(c,i){
    return '<input class="sr" type="radio" name="cat" id="cat'+i+'" value="'+c+'"'+(c===sel?' checked':'')+'><label for="cat'+i+'">'+c+'</label>';
  }).join('');
}
function formType(){return $('tIn').checked?'in':'out'}
function syncType(){$('catBox').hidden=formType()==='in'}
function defaultDate(){return ym===today().slice(0,7)?today():ym+'-01'}
function resetForm(){
  editId=null;$('formTitle').textContent='新增一筆';$('submitBtn').textContent='加入';
  $('cancelEdit').hidden=true;$('delBtn').hidden=true;$('amt').value='';$('desc').value='';$('fixed').checked=false;$('amtErr').hidden=true;
}
function startEdit(id){
  var e=S.entries.find(function(x){return x.id===id});if(!e)return;
  editId=id;$('formTitle').textContent='修改呢一筆';$('submitBtn').textContent='儲存';
  $('cancelEdit').hidden=false;$('delBtn').hidden=false;
  $('amt').value=(e.amt/100).toFixed(2).replace(/\.00$/,'');$('desc').value=e.desc;$('date').value=e.date;$('fixed').checked=e.fixed;
  $(e.type==='in'?'tIn':'tOut').checked=true;renderChips(e.type==='in'?CATS[0]:e.cat);syncType();
  $('form').scrollIntoView({block:'start',behavior:'smooth'});
}

function toast(msg,act,fn){
  $('toastMsg').textContent=msg;var b=$('toastAct');b.hidden=!act;
  if(act){b.textContent=act;b.onclick=function(){fn();$('toast').hidden=true}}
  $('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(function(){$('toast').hidden=true},act?6000:3200);
}
function copy(text,ok){
  var fb=function(){var io=$('io');io.value=text;io.focus();io.select();toast('自動複製唔到，文字已放喺下面，請手動全選複製。')};
  try{navigator.clipboard.writeText(text).then(function(){toast(ok)},fb)}catch(e){fb()}
}
function clean(x){
  if(!x||typeof x!=='object')return null;
  var amt=Math.round(Number(x.amt));
  if(!/^\d{4}-\d{2}-\d{2}$/.test(x.date)||!(amt>0))return null;
  return {id:String(x.id||uid()).slice(0,40),date:x.date,amt:amt,type:x.type==='in'?'in':'out',desc:String(x.desc||'').slice(0,60),cat:String(x.cat||'其他').slice(0,20),on:x.on!==false,fixed:!!x.fixed};
}

$('prev').onclick=function(){ym=shiftYm(ym,-1);filterCat=null;if(!editId)$('date').value=defaultDate();render()};
$('next').onclick=function(){ym=shiftYm(ym,1);filterCat=null;if(!editId)$('date').value=defaultDate();render()};
$('toNow').onclick=function(){ym=today().slice(0,7);filterCat=null;if(!editId)$('date').value=defaultDate();render()};
$('startReal').onclick=function(){S={entries:[],budget:null,cur:'MOP',demo:false};save();$('budget').value='';filterCat=null;resetForm();render();toast('示範已清走。由而家起嘅記錄會儲存喺呢部機。')};
$('tOut').onchange=$('tIn').onchange=syncType;

$('form').addEventListener('submit',function(ev){
  ev.preventDefault();
  var amt=parseAmt($('amt').value);
  if(amt===null){$('amtErr').hidden=false;$('amt').focus();return}
  $('amtErr').hidden=true;
  var type=formType(),catEl=document.querySelector('input[name="cat"]:checked');
  var d=/^\d{4}-\d{2}-\d{2}$/.test($('date').value)?$('date').value:defaultDate();
  var data={date:d,amt:amt,type:type,desc:$('desc').value.trim(),cat:type==='in'?'收入':(catEl?catEl.value:'其他'),fixed:$('fixed').checked};
  if(editId){var e=S.entries.find(function(x){return x.id===editId});if(e)Object.assign(e,data)}
  else{data.id=uid();data.on=true;S.entries.push(data)}
  var was=editId;save();ym=d.slice(0,7);resetForm();render();
  toast(was?'已儲存':'已加入 '+S.cur+' '+fmt(amt));
  if(!was)$('amt').focus();
});
$('cancelEdit').onclick=function(){resetForm();$('date').value=defaultDate()};
$('delBtn').onclick=function(){
  var i=S.entries.findIndex(function(x){return x.id===editId});if(i<0)return;
  lastDel={e:S.entries[i],i:i};S.entries.splice(i,1);save();resetForm();$('date').value=defaultDate();render();
  toast('已刪除','復原',function(){S.entries.splice(Math.min(lastDel.i,S.entries.length),0,lastDel.e);save();render()});
};
$('list').addEventListener('change',function(ev){
  var id=ev.target.getAttribute('data-toggle');if(!id)return;
  var e=S.entries.find(function(x){return x.id===id});if(e){e.on=ev.target.checked;save();render()}
});
$('list').addEventListener('click',function(ev){var b=ev.target.closest('[data-edit]');if(b)startEdit(b.getAttribute('data-edit'))});
$('cats').addEventListener('click',function(ev){var b=ev.target.closest('[data-cat]');if(!b)return;var c=b.getAttribute('data-cat');filterCat=filterCat===c?null:c;render()});
$('clearFilter').onclick=function(){filterCat=null;render()};
$('trend').addEventListener('click',function(ev){var b=ev.target.closest('[data-ym]');if(!b)return;ym=b.getAttribute('data-ym');filterCat=null;if(!editId)$('date').value=defaultDate();render()});
$('carry').onclick=function(){
  var cl=carryList(),n=daysIn(ym);
  cl.forEach(function(p){S.entries.push({id:uid(),date:ym+'-'+pad(Math.min(Number(p.date.slice(8)),n)),amt:p.amt,type:p.type,desc:p.desc,cat:p.cat,on:true,fixed:true})});
  save();render();toast('已帶入 '+cl.length+' 項固定開支');
};
$('budget').onchange=function(){var v=parseAmt($('budget').value);S.budget=v;if(v===null)$('budget').value='';save();render()};
$('cur').onchange=function(){S.cur=$('cur').value;save();render()};
$('copyJson').onclick=function(){copy(JSON.stringify({app:'monthbook',v:1,budget:S.budget,cur:S.cur,entries:S.entries}),'備份已複製，貼去備忘錄保存。')};
$('copyCsv').onclick=function(){
  var q=function(s){return '"'+String(s).replace(/"/g,'""')+'"'};
  var rows=S.entries.slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0}).map(function(e){
    return [e.date,e.type==='in'?'收入':'支出',q(e.cat),q(e.desc),(e.amt/100).toFixed(2),e.on?'是':'否',e.fixed?'是':'否'].join(',')});
  copy(['日期,類型,分類,說明,金額,計入,固定'].concat(rows).join('\n'),'CSV 已複製，可以貼去 Numbers 或 Excel。');
};
$('importBtn').onclick=function(){
  var raw=$('io').value.trim();if(!raw){toast('請先將備份文字貼入上面個格。');return}
  var data;try{data=JSON.parse(raw)}catch(e){toast('呢段文字唔係有效備份。請貼返「複製備份」得到嘅完整內容。');return}
  var arr=(Array.isArray(data)?data:data&&data.entries)||[],good=arr.map(clean).filter(Boolean);
  if(!good.length){toast('備份入面搵唔到任何記錄。');return}
  if(S.demo)S={entries:[],budget:null,cur:'MOP',demo:false};
  good.forEach(function(g){var i=S.entries.findIndex(function(x){return x.id===g.id});if(i>=0)S.entries[i]=g;else S.entries.push(g)});
  if(data&&!Array.isArray(data)){if(data.budget>0)S.budget=Math.round(data.budget);if(typeof data.cur==='string')S.cur=data.cur.slice(0,4)}
  save();$('io').value='';$('budget').value=S.budget?String(S.budget/100):'';$('cur').value=S.cur;render();toast('已匯入 '+good.length+' 筆記錄');
};
var wipeArmed=false,wipeTimer=null;
$('wipe').onclick=function(){
  var b=$('wipe');
  if(!wipeArmed){wipeArmed=true;b.textContent='確定？再撳一次就清除';wipeTimer=setTimeout(function(){wipeArmed=false;b.textContent='清除全部資料'},4000);return}
  clearTimeout(wipeTimer);wipeArmed=false;b.textContent='清除全部資料';
  S={entries:[],budget:null,cur:S.cur,demo:false};save();$('budget').value='';filterCat=null;resetForm();render();toast('全部資料已清除');
};

renderChips(CATS[0]);syncType();
$('date').value=defaultDate();
$('budget').value=S.budget?String(S.budget/100):'';
if([].some.call($('cur').options,function(o){return o.value===S.cur}))$('cur').value=S.cur;
render();
if(document.querySelector('meta[name="monthbook-standalone"]')&&'serviceWorker' in navigator){
  try{navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}
}
})();
</script>
</body>
</html>
